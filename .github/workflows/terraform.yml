name: Terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write  # OIDC
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: envs/prod
  AWS_REGION: eu-central-1

jobs:
  terraform:
    name: ${{ github.event_name == 'push' && 'apply' || 'plan' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # PRs get a read-only role: the apply role only trusts main, and PR
          # code (including this workflow) must never be able to write to AWS.
          role-to-assume: ${{ github.event_name == 'pull_request' && secrets.AWS_INFRA_PLAN_ROLE_ARN || secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform format check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive ../../

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -no-color -out=tfplan \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="anthropic_api_key=${{ secrets.ANTHROPIC_API_KEY }}" \
            -var="langfuse_public_key=${{ secrets.LANGFUSE_PUBLIC_KEY }}" \
            -var="langfuse_secret_key=${{ secrets.LANGFUSE_SECRET_KEY }}" \
            -var="hosted_zone_name=${{ secrets.HOSTED_ZONE_NAME }}"

      # Runs when the plan failed too, so the error lands on the PR; the job
      # still fails because the plan step did.
      - name: Post plan to PR
        if: github.event_name == 'pull_request' && !cancelled() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            ${{ steps.plan.outputs.stderr }}
            \`\`\`
            *Pushed by @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
